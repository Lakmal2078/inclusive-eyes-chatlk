name = "chatlk"
main = "src/index.js"
compatibility_date = "2026-09-04"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "chat-db"
database_id = "bead94cf-542e-407e-a6d5-ea77d0b08342"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "CACHE"
id = "eacaab54753d4c6b9b17033350ab9bf3"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "chat-media"

[[durable_objects.bindings]]
name = "CHAT_ROOM"
class_name = "ChatRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoom"]

[ai]
binding = "AI"

[vars]
APP_NAME = "ChatLK"
SUPPORTED_LANGUAGES = "si,ta,en"
MAX_FILE_SIZE_MB = "100"
PREMIUM_MAX_FILE_SIZE_MB = "500"
CORS_ORIGIN = "*"

[env.staging]
name = "chatlk-staging"
vars = { ENVIRONMENT = "staging", APP_NAME = "ChatLK Staging", CORS_ORIGIN = "https://staging.chatlk.example" }

